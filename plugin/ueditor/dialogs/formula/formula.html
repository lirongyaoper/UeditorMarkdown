<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
    <script type="text/javascript" src="../internal.js?df5a6b9e"></script>
    <style type="text/css">
        html, body { margin: 0; padding: 0; background: #FFF; }
        .wrapper {
            box-sizing: border-box;
            width: 820px;
            height: 460px;
            display: flex;
            flex-direction: column;
            font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #24292f;
        }
        .fx-main { flex: 1; display: flex; min-height: 0; }
        .fx-left { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 10px; }
        .fx-preview {
            flex: 0 0 300px;
            border-left: 1px solid #EEE;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        .fx-preview .title, .fx-left .title { font-weight: 600; margin-bottom: 6px; color: #57606a; }
        #latexInput {
            flex: 1;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #DDD;
            border-radius: 4px;
            padding: 8px;
            font-family: Consolas, Monaco, "Courier New", monospace;
            font-size: 13px;
            resize: none;
            outline: none;
        }
        #latexInput:focus { border-color: #09f; }
        .fx-mode { margin-top: 8px; display: flex; align-items: center; gap: 14px; }
        .fx-mode label { cursor: pointer; user-select: none; }
        .fx-tip { margin-top: 6px; color: #999; font-size: 12px; }
        .fx-tip a { color: #09f; text-decoration: none; }
        #previewBox {
            flex: 1;
            border: 1px dashed #E0E0E0;
            border-radius: 4px;
            overflow: auto;
            padding: 12px;
            text-align: center;
            background: #FAFAFA;
        }
        #previewBox .err { color: #d33; font-size: 12px; white-space: pre-wrap; text-align: left; }
        .tpl-panel { margin-top: 8px; }
        .tpl-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
        .tpl-tabs span {
            padding: 2px 10px;
            border: 1px solid #E0E0E0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            color: #57606a;
            background: #FAFAFA;
            user-select: none;
        }
        .tpl-tabs span.on { background: #09f; border-color: #09f; color: #FFF; }
        .tpl-items { display: flex; flex-wrap: wrap; gap: 4px; max-height: 96px; overflow: auto; }
        .tpl-items span {
            min-width: 34px;
            text-align: center;
            padding: 3px 8px;
            border: 1px solid #EEE;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            background: #FFF;
        }
        .tpl-items span:hover { border-color: #09f; color: #09f; }
        .tpl-items .t { font-family: Consolas, monospace; font-size: 12px; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="fx-main">
        <div class="fx-left">
            <div class="title">LaTeX 公式</div>
            <textarea id="latexInput" spellcheck="false" placeholder="输入 LaTeX 公式，例如 \frac{1}{2} 或 E=mc^2"></textarea>
            <div class="fx-mode">
                <label><input type="radio" name="fxmode" value="inline" checked> 行内公式</label>
                <label><input type="radio" name="fxmode" value="block"> 块级公式（独占一行居中）</label>
            </div>
            <div class="tpl-panel">
                <div class="tpl-tabs" id="tplTabs"></div>
                <div class="tpl-items" id="tplItems"></div>
            </div>
            <div class="fx-tip">
                支持 LaTeX 与 mhchem 化学式（<a href="javascript:;" id="inputDemo">\ce{H2O} 示例</a>）；
                $…$ / $$…$$ 定界符不用手写。
            </div>
        </div>
        <div class="fx-preview">
            <div class="title">实时预览</div>
            <div id="previewBox"></div>
        </div>
    </div>
</div>
<script src="../../../katex/katex.min.js"></script>
<script src="../../../katex/contrib/mhchem.min.js"></script>
<link rel="stylesheet" href="../../../katex/katex.min.css">
<script type="text/javascript" src="formula.js?b5e4ff82"></script>
<script type="text/javascript">
    utils.domReady(function () {
        Formula.init();
    });
</script>
</body>
</html>
