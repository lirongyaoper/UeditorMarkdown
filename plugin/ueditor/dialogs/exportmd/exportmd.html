<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title></title>
    <script type="text/javascript" src="../internal.js?df5a6b9e"></script>
    <style type="text/css">
        html, body {
            height: 100%;
            width: 100%;
            padding: 0;
            margin: 0;
            background: #FFF;
        }

        .wrapper {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .toolbar label {
            display: inline-flex;
            align-items: center;
            font-size: 12px;
            color: #666;
            margin-left: 12px;
            cursor: pointer;
            user-select: none;
        }

        .toolbar label input {
            margin: 0 4px 0 0;
            vertical-align: middle;
        }

        .toolbar .tip {
            color: #999;
            font-size: 12px;
            flex-grow: 1;
            padding-left: 10px;
        }

        .toolbar a {
            display: inline-block;
            text-decoration: none;
            color: #333;
            background: #F8F8F8;
            border: 1px solid #EEE;
            border-radius: 4px;
            padding: 0 14px;
            line-height: 26px;
            margin-left: 8px;
            cursor: pointer;
        }

        .toolbar a:hover {
            background: #F0F0F0;
        }

        #mdContent {
            flex-grow: 1;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #DDD;
            border-radius: 4px;
            padding: 8px;
            font-family: Consolas, Monaco, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: none;
            outline: none;
            white-space: pre;
            overflow: auto;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="toolbar">
        <a href="javascript:;" id="btnCopy">复制全文</a>
        <a href="javascript:;" id="btnDownload">下载 .md 文件</a>
        <label><input type="checkbox" id="optNbsp">保留段首缩进</label>
        <label><input type="checkbox" id="optRich" checked>保留富文本格式</label>
        <span class="tip" id="tip"></span>
    </div>
    <textarea id="mdContent" spellcheck="false"></textarea>
</div>
<script type="text/javascript" src="exportmd.js?d4b65a7e"></script>
</body>
</html>
